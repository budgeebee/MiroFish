services:
  graphiti:
    build:
      context: /home/irvins/Projects/graphiti
      args:
        INSTALL_KUZU: "true"
    container_name: graphiti_api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - KUZU_DB_PATH=/data/kuzu/graphiti.db
      - PORT=8000
      - db_backend=kuzu
      - AI_BACKEND_URL=http://host.docker.internal:9400
      - AI_BACKEND_PROVIDER=${AI_BACKEND_PROVIDER:-minimax}
      - AI_BACKEND_MODEL=${AI_BACKEND_MODEL:-MiniMax-M3}
      - MODEL_NAME=${AI_BACKEND_MODEL:-MiniMax-M3}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-}
      - EMBEDDING_DIM=768
      # OpenAIClient default-constructs during init() even when AIBackendClient
      # is used at runtime. The api_key is opaque from this container's
      # perspective — AIBackendClient doesn't use it.
      - OPENAI_API_KEY=ai-backend-routed
    restart: unless-stopped
    user: "0:0"
    volumes:
      - kuzu_data:/data/kuzu
    networks:
      - graphiti_network

  mirofish-openai-shim:
    build:
      context: ./openai-shim
    container_name: mirofish-openai-shim
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AI_BACKEND_URL=http://host.docker.internal:9400
      - AI_BACKEND_API_KEY=${AI_BACKEND_API_KEY:-}
      - SHIM_PROVIDER=${AI_BACKEND_PROVIDER:-minimax}
      - SHIM_MODEL=${AI_BACKEND_MODEL:-MiniMax-M3}
      - LOG_LEVEL=INFO
    ports:
      - "127.0.0.1:9401:9401"
    restart: unless-stopped
    networks:
      - graphiti_network

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AI_BACKEND_URL=http://host.docker.internal:9400
      - AI_BACKEND_API_KEY=${AI_BACKEND_API_KEY:-}
      - AI_BACKEND_PROVIDER=${AI_BACKEND_PROVIDER:-minimax}
      - AI_BACKEND_MODEL=${AI_BACKEND_MODEL:-MiniMax-M3}
      - AI_BACKEND_BOOST_PROVIDER=${AI_BACKEND_BOOST_PROVIDER:-deepseek}
      - AI_BACKEND_BOOST_MODEL=${AI_BACKEND_BOOST_MODEL:-deepseek-v4-flash}
      # camel-oasis uses OpenAI SDK; point it at the shim, not directly at a provider.
      - OPENAI_BASE_URL=http://mirofish-openai-shim:9401/v1
      - OPENAI_API_KEY=shim-routed
    # Backend only — no frontend. The pipeline (`crucix_to_mirofish.py` in
    # `mirofish-api`) calls /api/simulation/start, /api/report/generate etc.
    # against MIROFISH_URL=http://mirofish:5001.
    command: ["npm", "run", "backend"]
    ports:
      - "5005:5001"
    restart: unless-stopped
    depends_on:
      graphiti:
        condition: service_healthy
      mirofish-openai-shim:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/app:/app/backend/app
      - ./locales:/app/locales
    networks:
      - graphiti_network

  mirofish-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mirofish-api
    env_file:
      - .env
    environment:
      - MIROFISH_DIR=/data
      - MIROFISH_OUTPUT_DIR=/data/output
      - MIROFISH_URL=http://mirofish:5001
      - CRUCIX_LATEST=/crucix/runs/latest.json
      - CRUCIX_URL=http://host.docker.internal:3117
      - SCHWALPACA_URL=http://host.docker.internal:8855
      - SCHWALPACA_JOURNAL=/journals/schwalpaca/trading-journal.json
      - KALSHI_JOURNAL=/journals/kalshi/kalshi-trading-journal.json
      - INSIDER_CAPITOL_URL=http://host.docker.internal:9700
      - NEWS_AGGREGATOR_URL=http://news-aggregator:8000
      - LLAMA_SWAP_URL=http://host.docker.internal:8090
      - AI_BACKEND_URL=http://host.docker.internal:9400
      - AI_BACKEND_API_KEY=${AI_BACKEND_API_KEY:-}
      - AI_BACKEND_PROVIDER=${AI_BACKEND_PROVIDER:-minimax}
      - AI_BACKEND_MODEL=${AI_BACKEND_MODEL:-MiniMax-M3}
      - AI_BACKEND_BOOST_PROVIDER=${AI_BACKEND_BOOST_PROVIDER:-deepseek}
      - AI_BACKEND_BOOST_MODEL=${AI_BACKEND_BOOST_MODEL:-deepseek-v4-flash}
      - GRAPHITI_URL=http://graphiti_api:8000
    ports:
      - "5010:5010"
    volumes:
      - ./output:/data/output
      - ./scripts:/data/scripts
      - /home/irvins/Projects/Crucix/runs:/crucix/runs:ro
      - /home/irvins/Projects/schwalpaca/journal:/journals/schwalpaca:ro
      - /home/irvins/Projects/kalshimarket/journal:/journals/kalshi:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - graphiti_network

volumes:
  kuzu_data:

networks:
  graphiti_network:
    name: graphiti_network
    external: false