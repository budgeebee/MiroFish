services:
  graphiti:
    build:
      context: /home/irvins/Projects/graphiti
      args:
        INSTALL_KUZU: "true"
    container_name: graphiti_api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - KUZU_DB_PATH=/data/kuzu/graphiti.db
      - PORT=8000
      - db_backend=kuzu
      - OPENAI_API_KEY=${LLM_API_KEY}
      - OPENAI_BASE_URL=${LLM_BASE_URL}
      - MODEL_NAME=${LLM_MODEL_NAME}
      - EMBEDDING_MODEL_NAME=${LLM_EMBEDDING_MODEL_NAME:-}
      - EMBEDDING_DIM=768
    restart: unless-stopped
    user: "0:0"
    volumes:
      - kuzu_data:/data/kuzu
    networks:
      - graphiti_network

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3003:3000"
      - "5005:5001"
    restart: unless-stopped
    depends_on:
      graphiti:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/app:/app/backend/app
      - ./locales:/app/locales
    networks:
      - graphiti_network

  mirofish-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mirofish-api
    env_file:
      - .env
    environment:
      - MIROFISH_DIR=/data
      - MIROFISH_OUTPUT_DIR=/data/output
      - MIROFISH_URL=http://mirofish:5001
      - CRUCIX_LATEST=/crucix/runs/latest.json
      - NEWS_AGGREGATOR_URL=http://news-aggregator:8000
    ports:
      - "5010:5010"
    volumes:
      - ./output:/data/output
      - ./scripts:/data/scripts
      - /home/irvins/Projects/Crucix/runs:/crucix/runs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - graphiti_network

volumes:
  kuzu_data:

networks:
  graphiti_network:
    name: graphiti_network
    external: false
